spring.application.name=HelloChoco

# =====================
# CORS
# Vue PWA frontend on CloudType calls this Spring API directly from the browser.
# Override APP_CORS_ALLOWED_ORIGIN_PATTERNS when you want to restrict domains.
# =====================
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://*.cloudtype.app,http://localhost:*,http://127.0.0.1:*}

# =====================
# Mail
# Gmail 사용 시 password에는 일반 비밀번호가 아니라 앱 비밀번호를 입력한다.
# auth.mail-send-enabled=false: 개발자용 인증코드를 화면에 표시
# auth.mail-send-enabled=true : 실제 이메일 발송
# =====================
auth.mail-send-enabled=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =====================
# OpenAI
# =====================
# 실제운영시 환경변수에서 읽기
openai.api-key=${OPENAI_API_KEY:}

# =====================
# File
# /app/dog-walk-nas/upload/
# c:/dog-walk-nas/upload/
# =====================
file.upload-root-path=${FILE_UPLOAD_ROOT_PATH:}

# =====================
# PostgreSQL(Local) 
# =====================
#spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
#spring.datasource.username=${DB_USERNAME:}
#spring.datasource.password=${DB_PASSWORD:}
#spring.datasource.driver-class-name=org.postgresql.Driver

# =====================
# PostgreSQL(Dev) 
# =====================
spring.datasource.url=jdbc:postgresql://svc.sel3.cloudtype.app:30677/postgres
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================
# JPA (Hibernate)
# =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# =====================
# MyBatis
# =====================
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.type-aliases-package=com.example.domain
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

logging.level.org.mybatis=DEBUG
logging.level.java.sql=DEBUG

# =====================
# 업로드용량 제한
# =====================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
